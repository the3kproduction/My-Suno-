<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3AM VERIFIED - Enhanced Music Bot</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* Theme Variables */
    :root {
        --bg-primary: linear-gradient(-45deg, #667eea, #764ba2, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3);
        --bg-secondary: rgba(255, 255, 255, 0.1);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --border-color: rgba(255, 255, 255, 0.2);
        --input-bg: rgba(255, 255, 255, 0.2);
        --card-bg: rgba(255, 255, 255, 0.15);
        --shadow: rgba(0, 0, 0, 0.3);
    }
    
    [data-theme="light"] {
        --bg-primary: linear-gradient(-45deg, #e3f2fd, #f3e5f5, #ffebee, #e0f2f1, #e1f5fe, #f1f8e9, #fff3e0, #fce4ec);
        --bg-secondary: rgba(0, 0, 0, 0.05);
        --text-primary: #333333;
        --text-secondary: #666666;
        --border-color: rgba(0, 0, 0, 0.1);
        --input-bg: rgba(0, 0, 0, 0.05);
        --card-bg: rgba(255, 255, 255, 0.8);
        --shadow: rgba(0, 0, 0, 0.1);
    }
    
    [data-theme="dark"] {
        --bg-primary: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483, #2d1b69, #0f0f23, #1a1a2e, #16213e);
        --bg-secondary: rgba(255, 255, 255, 0.05);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.6);
        --border-color: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(255, 255, 255, 0.1);
        --card-bg: rgba(255, 255, 255, 0.1);
        --shadow: rgba(0, 0, 0, 0.5);
    }
    
    @keyframes gentleGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-primary);
        background-size: 800% 800%;
        animation: gentleGradient 30s ease infinite;
        min-height: 100vh; 
        color: var(--text-primary); 
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        transition: all 0.3s ease;
    }
    
    .theme-switcher {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        background: var(--card-bg);
        border-radius: 50px;
        padding: 4px;
        backdrop-filter: blur(15px);
        border: 1px solid var(--border-color);
        z-index: 1000;
    }

    .theme-btn {
        background: transparent;
        border: none;
        padding: 10px 20px;
        border-radius: 50px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
        font-weight: 600;
    }

    .theme-btn.active,
    .theme-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: var(--text-primary);
        transform: translateY(-1px);
    }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <button id="auto-btn" class="theme-btn active" onclick="setTheme('auto')">🌍 Auto</button>
        <button id="light-btn" class="theme-btn" onclick="setTheme('light')">☀️ Light</button>
        <button id="dark-btn" class="theme-btn" onclick="setTheme('dark')">🌙 Dark</button>
    </div>

    <script>
        // Theme System
        function setTheme(theme) {
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById(theme + '-btn').classList.add('active');
            
            if (theme === 'auto') {
                const hour = new Date().getHours();
                const autoTheme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', autoTheme);
                localStorage.setItem('theme', 'auto');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'auto';
            setTheme(savedTheme);
        }

        setInterval(() => {
            if (localStorage.getItem('theme') === 'auto') {
                setTheme('auto');
            }
        }, 60000);

        initTheme();
    </script>
</body>
</html>
